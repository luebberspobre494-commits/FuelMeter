name: FuelMeter
options:
  bundleIdPrefix: com.luebberspobre
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: 6FY8HHKPS2
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  FuelMeter:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FuelMeter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luebberspobre.fuelmeter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  FuelMeterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FuelMeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luebberspobre.fuelmeter.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FuelMeter:
    build:
      targets:
        FuelMeter: all
        FuelMeterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FuelMeterTests
    archive:
      config: Release
